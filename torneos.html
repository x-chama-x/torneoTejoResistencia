<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - Air Hockey</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/torneo.css">
    <link rel="stylesheet" href="css/playoffs.css">
    <style>
        /* Layout de la fase de liga: Estadísticas queda bajo Posiciones en PC
           y bajo Resultados en móvil (igual que en las páginas viejas) */
        @media (min-width: 901px) {
            #col-posiciones { grid-column: 1; grid-row: 1; }
            #col-resultados { grid-column: 2; grid-row: 1 / span 2; }
            #col-stats { grid-column: 1; grid-row: 2; }
        }
        @media (max-width: 900px) {
            .home-container { display: flex; flex-direction: column; }
            #col-posiciones { order: 1; }
            #col-resultados { order: 2; }
            #col-stats { order: 3; }
        }

        .torneo-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .torneo-btn {
            padding: 8px 22px;
            border-radius: 20px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }
        .torneo-btn:hover { border-color: #58a6ff; color: #ffffff; }
        .torneo-btn.active { background: #58a6ff; border-color: #58a6ff; color: #0d1117; }

        /* --- Partidos todavia no jugados --- */
        /* La barra de probabilidad reusa las clases de css/playoffs.css
           (.sf-split-bar, .split-segment, .sf-prob-badge, .sf-insight) */
        .prob-bloque { margin: 10px 0 4px 0; }
        .prob-badges {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
        }
        .prob-bloque.compacta { margin: 0; min-width: 150px; }
        .prob-bloque.compacta .sf-split-bar { height: 12px; }
        .prob-bloque.compacta .prob-badges { margin-top: 4px; }
        .prob-bloque.compacta .sf-prob-badge { font-size: 0.72rem; padding: 1px 6px; }

        .prob-sin-datos {
            font-size: 0.78rem;
            color: #8b949e;
            font-style: italic;
            text-align: center;
            padding: 6px 0;
        }

        /* Las filas pendientes van mas apagadas que los resultados reales */
        .fila-pendiente td { opacity: 0.92; }
        .fila-pendiente td:first-child,
        .fila-pendiente td:last-child { color: #8b949e; }

        .match-card-pendiente { opacity: 0.95; }
        .match-card-pendiente .player { color: #c9d1d9; }

        /* Jugador todavia sin definir (la final antes de las semis) */
        .player.por-definir {
            color: #8b949e;
            font-style: italic;
            font-weight: 500;
        }

        /* Candidatos al titulo, en la tarjeta de la final */
        .candidatos {
            margin: 12px 0 4px 0;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }
        .candidatos-titulo {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8b949e;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        .candidato {
            display: grid;
            grid-template-columns: 4.5em 1fr 3.2em;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }
        .candidato-nombre {
            font-weight: 700;
            color: #c9d1d9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .candidato-barra {
            height: 8px;
            min-width: 60px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
        }
        .candidato-relleno {
            display: block;
            height: 100%;
            min-width: 4px;   /* que un 0.6% se siga viendo */
            border-radius: 4px;
        }
        .candidato-relleno.alta       { background: linear-gradient(90deg, #238636, #2ea043); }
        .candidato-relleno.media-alta { background: linear-gradient(90deg, #9e6a03, #d29922); }
        .candidato-relleno.media      { background: linear-gradient(90deg, #a67f22, #e3b341); }
        .candidato-relleno.baja       { background: linear-gradient(90deg, #da3633, #f85149); }
        /* Al eliminado no le dibujamos barra vacia: la leyenda ocupa ese lugar,
           asi tampoco se desborda la columna del porcentaje en celular */
        .candidato.eliminado { grid-template-columns: 4.5em 1fr; }
        .candidato.eliminado .candidato-barra { display: none; }
        .candidato.eliminado .candidato-nombre { color: #6e7681; text-decoration: line-through; }
        .candidato.eliminado .candidato-pct { color: #6e7681; font-style: italic; font-weight: 500; font-size: 0.72rem; }
        .candidato-pct {
            text-align: right;
            font-weight: 700;
            color: #8b949e;
            font-variant-numeric: tabular-nums;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>
            <img src="img/favicon.png" alt="logo" style="width: 1em; height: 1em; vertical-align: middle; margin-right: 5px;">
            <span id="titulo-torneo">Torneos</span>
        </h1>

        <div class="torneo-selector" id="torneo-selector">
            <!-- Poblado por JS a partir de enfrentamientos_directos.txt -->
        </div>

        <div class="panel playoffs-section" style="margin-bottom: 2rem;">
            <h2>👑 Playoffs</h2>
            <div class="playoff-bracket" id="playoff-bracket">
                <!-- Poblado por JS -->
            </div>
            <div id="tercer-puesto-container" style="margin-top: 1rem; text-align: center;">
                <!-- Poblado por JS -->
            </div>
        </div>

        <!-- Fase de grupos (solo para torneos de formato grupos) -->
        <div id="bloque-grupos" style="display: none;">
            <h2>🏆 Fase de Grupos</h2>
            <br>
            <div id="grupos-container">
                <!-- Poblado por JS -->
            </div>
        </div>

        <!-- Repechajes y eliminatorio (solo formato de 9 jugadores) -->
        <div id="repechajes-container" style="display: none;">
            <!-- Poblado por JS -->
        </div>

        <!-- Fase de liga (solo para torneos de formato liga) -->
        <div id="bloque-liga" style="display: none;">
            <h2>🏆 Fase de Liga</h2>
            <br>
            <div class="home-container">
                <div id="col-posiciones">
                    <h3 style="margin-bottom: 1rem; text-align: center; color: #eff0f3;">Posiciones</h3>
                    <div class="table-responsive">
                        <table class="ranking-table" id="tabla-posiciones">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Jugador</th>
                                    <th>PJ</th>
                                    <th>G</th>
                                    <th>P</th>
                                    <th>GF</th>
                                    <th>GC</th>
                                    <th>DIF</th>
                                    <th>PTS(GF)</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-body">
                                <!-- Poblado por JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="col-resultados">
                    <h3 style="margin-bottom: 1rem; text-align: center; color: #eff0f3;">Resultados</h3>
                    <div id="resultados-fase">
                        <!-- Poblado por JS -->
                    </div>
                </div>

                <div id="col-stats">
                    <!-- El contenedor de stats se mueve acá o al bloque de grupos,
                         según el formato del torneo elegido (ver torneos.js) -->
                    <div id="stats-container" style="margin-top: 2rem;">
                        <!-- Poblado por JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/menu.js"></script>
    <script src="js/rankingCalculator.js"></script>
    <script src="js/probabilidades.js"></script>
    <script src="lib/torneo-formatos.js"></script>
    <script src="js/historial_torneos.js"></script>
    <script src="js/pendientes.js"></script>
    <script src="js/torneos.js"></script>
</body>
</html>
