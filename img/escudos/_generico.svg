<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112" role="img" aria-label="Escudo genérico" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Escudo sin asignar</title>
  <!--
    Escudo provisorio para los jugadores que todavia no tienen el suyo.
    Mismo esquema que el de Chama (corona, escudo con borde dorado, fondo
    azul marino) pero sin mascota: adentro va el tejo, que es lo que une a
    todos. Esta pensado para leerse a 16px, asi que no tiene detalle fino:
    a ese tamaño solo se ven la corona, el borde dorado y el disco claro.
    Es SVG a proposito: pesa 2 KB y se ve nitido en cualquier pantalla.
  -->
  <defs>
    <linearGradient id="eg-oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d070"/>
      <stop offset="0.5" stop-color="#e3a81b"/>
      <stop offset="1" stop-color="#b9820c"/>
    </linearGradient>
    <linearGradient id="eg-azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3f7d"/>
      <stop offset="1" stop-color="#0c1c3d"/>
    </linearGradient>
    <linearGradient id="eg-disco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c4d4"/>
    </linearGradient>
  </defs>

  <!-- Corona -->
  <path d="M26 26 L22 9 L34 17 L50 4 L66 17 L78 9 L74 26 Z"
        fill="url(#eg-oro)" stroke="#8a5f06" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="25" y="26" width="50" height="6" rx="2"
        fill="url(#eg-oro)" stroke="#8a5f06" stroke-width="1.4"/>
  <circle cx="22" cy="9" r="3.6" fill="#f7d070" stroke="#8a5f06" stroke-width="1.2"/>
  <circle cx="50" cy="4" r="3.8" fill="#f7d070" stroke="#8a5f06" stroke-width="1.2"/>
  <circle cx="78" cy="9" r="3.6" fill="#f7d070" stroke="#8a5f06" stroke-width="1.2"/>

  <!-- Escudo: borde dorado -->
  <path d="M12 36 H88 V72 C88 92 70 104 50 110 C30 104 12 92 12 72 Z"
        fill="url(#eg-oro)" stroke="#8a5f06" stroke-width="2" stroke-linejoin="round"/>
  <!-- Escudo: filo blanco -->
  <path d="M19 43 H81 V71 C81 87 66 97 50 102 C34 97 19 87 19 71 Z"
        fill="#f2f4f8"/>
  <!-- Escudo: campo azul -->
  <path d="M23 47 H77 V70 C77 84 64 93 50 98 C36 93 23 84 23 70 Z"
        fill="url(#eg-azul)"/>

  <!-- El tejo -->
  <ellipse cx="50" cy="71" rx="17" ry="13" fill="url(#eg-disco)"
           stroke="#8a5f06" stroke-width="1.8"/>
  <ellipse cx="50" cy="68" rx="9.5" ry="7" fill="none"
           stroke="#9aa6b8" stroke-width="1.6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
